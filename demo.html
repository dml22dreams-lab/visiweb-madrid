<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Demo · VisiWeb Madrid</title>
  <meta name="description" content="Demo comercial de VisiWeb Madrid: web de restaurante y carta QR Mesa con la misma plantilla del panel.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1917'/%3E%3Cpath d='M11 7h10c0 5-3 8-5 8s-5-3-5-8z' fill='%23f59e0b'/%3E%3Cpath d='M16 15v8m-4 0h8' stroke='%23f59e0b' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      max-width: 100%;
      overflow: hidden;
      background: #fff;
      color: #1c1917;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #demo-sales-banner {
      flex: none;
      width: 100%;
      border-bottom: 1px solid #e7e5e4;
      background: #fafaf9;
    }
    #demo-sales-banner > div {
      display: flex;
      max-width: 48rem;
      margin: 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      padding: 0.18rem 0.65rem;
      min-height: 1.85rem;
      position: relative;
    }
    #demo-sales-banner .demo-banner-copy {
      min-width: 0;
      margin: 0;
      overflow: hidden;
    }
    #demo-sales-banner .demo-banner-copy .label-row {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
      font-weight: 500;
      line-height: 1.2;
      color: #57534e;
    }
    #demo-banner-detail {
      display: none;
    }
    #demo-sales-banner .label-short { display: inline; }
    #demo-sales-banner .label-long { display: none; }
    @media (min-width: 640px) {
      #demo-sales-banner .label-short { display: none; }
      #demo-sales-banner .label-long { display: inline; }
    }
    .demo-view-switch {
      display: inline-flex;
      flex: none;
      padding: 1px;
      border: 1px solid #e7e5e4;
      border-radius: 999px;
      background: #fff;
      transform: translateX(-12px);
    }
    .demo-view-switch a {
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.25;
      color: #78716c;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .demo-view-switch a[aria-current="page"] {
      background: #1c1917;
      color: #fff;
    }
    a#plan-gastro-link {
      display: none;
      flex: none;
      white-space: nowrap;
      border: 1px solid #e7e5e4;
      border-radius: 999px;
      background: #fff;
      padding: 0.1rem 0.55rem;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      text-align: center;
      line-height: 1.25;
      color: #44403c;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease;
    }
    a#plan-gastro-link:hover {
      transform: translateY(2px) scale(.985);
      background-color: #f5f5f4;
      border-color: #d6d3d1;
      box-shadow: inset 0 2px 5px rgba(12, 10, 9, .22);
    }
    @media (min-width: 640px) {
      a#plan-gastro-link { display: inline-flex; align-items: center; }
    }
    #sales-whatsapp {
      display: inline-flex;
      flex: none;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      border-radius: 999px;
      background: #059669;
      padding: 0.1rem 0.55rem;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.25;
      color: #fff;
      text-decoration: none;
    }
    #sales-whatsapp:hover { background: #10b981; }
    #demo-stage {
      flex: 1 1 auto;
      width: 100%;
      border: 0;
      display: block;
      background: #fff;
    }
  </style>
  <script>
    window.FORCE_PLAN = 'digitalizacion-total';
    (function () {
      try {
        var params = new URLSearchParams(window.location.search || '');
        if (params.get('qr') === '1' || params.get('modo') === 'qr') {
          window.FORCE_QR_MESA = true;
        }
        params.set('plan', 'digitalizacion-total');
      } catch (e) { /* ignore */ }
    })();
  </script>
  <script src="./demo-guides.js?v=2"></script>
</head>
<body>
  <div id="demo-sales-banner">
    <div>
      <div class="demo-banner-copy">
        <p class="label-row">
          <span class="label-short" data-i18n="salesBarShort">Demo VisiWeb</span>
          <span class="label-long" data-i18n="salesBar">Demo de VisiWeb Madrid</span>
        </p>
        <p id="demo-banner-detail">Así quedaría tu local. Esta demo es interactiva.</p>
      </div>
      <div class="demo-view-switch" role="group" aria-label="Vista de la demo">
        <a href="./demo.html?plan=digitalizacion-total" id="demo-view-web" data-i18n="viewWeb" aria-current="page">Web</a>
        <a href="./demo.html?qr=1&plan=digitalizacion-total" id="demo-view-mesa" data-i18n="viewMesa">QR Mesa</a>
      </div>
      <a id="plan-gastro-link" href="https://visiwebmadrid.com/#digitalizacion-total" data-i18n="planBadge">Plan Digitalización Total</a>
      <a id="sales-whatsapp" href="https://wa.me/34608975906?text=Hola%2C%20he%20visto%20la%20demo%20y%20quiero%20una%20as%C3%AD%20para%20mi%20local." target="_blank" rel="noopener">
        <span data-i18n="salesBarCta">Pide la tuya</span>
      </a>
    </div>
  </div>
  <iframe id="demo-stage" title="Demo VisiWeb Madrid" allow="fullscreen"></iframe>
  <script>
    (function () {
      'use strict';

      var FORCE_PLAN = 'digitalizacion-total';
      window.FORCE_PLAN = FORCE_PLAN;

      var I18N = {
        es: {
          salesBar: 'Demo de VisiWeb Madrid',
          salesBarShort: 'Demo VisiWeb',
          salesBarCta: 'Pide la tuya',
          planBadge: 'Plan Digitalización Total',
          viewWeb: 'Web',
          viewMesa: 'QR Mesa',
          viewSwitch: 'Vista de la demo',
          frameTitle: 'Demo VisiWeb Madrid'
        },
        en: {
          salesBar: 'VisiWeb Madrid demo',
          salesBarShort: 'VisiWeb demo',
          salesBarCta: 'Request yours',
          planBadge: 'Digitalización Total Plan',
          viewWeb: 'Web',
          viewMesa: 'QR Mesa',
          viewSwitch: 'Demo view',
          frameTitle: 'VisiWeb Madrid demo'
        }
      };

      var params = new URLSearchParams(window.location.search || '');
      var lang = params.get('lang') === 'en' ? 'en' : 'es';
      var mesaMode = window.FORCE_QR_MESA === true || params.get('qr') === '1' || params.get('modo') === 'qr';
      var frame = document.getElementById('demo-stage');
      var btnWeb = document.getElementById('demo-view-web');
      var btnMesa = document.getElementById('demo-view-mesa');
      var switcher = document.querySelector('.demo-view-switch');
      var guides = window.VisiwebDemoGuides;

      function copy(key) {
        return (I18N[lang] && I18N[lang][key]) || I18N.es[key] || '';
      }

      function applyI18n() {
        document.documentElement.lang = lang;
        document.title = copy('frameTitle');
        frame.setAttribute('title', copy('frameTitle'));
        if (switcher) switcher.setAttribute('aria-label', copy('viewSwitch'));
        document.querySelectorAll('[data-i18n]').forEach(function (node) {
          var value = copy(node.getAttribute('data-i18n'));
          if (value) node.textContent = value;
        });
      }

      function withParams(url, mode) {
        var next = new URL(url, window.location.href);
        next.searchParams.set('plan', FORCE_PLAN);
        if (lang === 'en') next.searchParams.set('lang', 'en');
        else next.searchParams.delete('lang');
        if (mode === 'mesa') {
          next.searchParams.set('qr', '1');
        } else {
          next.searchParams.delete('qr');
          next.searchParams.delete('modo');
        }
        return next.pathname + next.search + next.hash;
      }

      function srcFor(mode) {
        if (mode === 'mesa') return withParams('panel/preview/mesa/', 'mesa');
        return withParams('panel/preview/', 'web');
      }

      function setMode(mode, syncUrl) {
        mesaMode = mode === 'mesa';
        if (mesaMode) window.FORCE_QR_MESA = true;
        else window.FORCE_QR_MESA = false;

        if (guides && guides.configure) {
          guides.configure({ lang: lang, mesa: mesaMode });
        }

        frame.src = srcFor(mesaMode ? 'mesa' : 'web');
        if (mesaMode) btnWeb.removeAttribute('aria-current');
        else btnWeb.setAttribute('aria-current', 'page');
        if (mesaMode) btnMesa.setAttribute('aria-current', 'page');
        else btnMesa.removeAttribute('aria-current');
        if (!syncUrl) return;
        try {
          var url = new URL(window.location.href);
          url.searchParams.set('plan', FORCE_PLAN);
          if (mesaMode) url.searchParams.set('qr', '1');
          else url.searchParams.delete('qr');
          url.searchParams.delete('modo');
          if (lang === 'en') url.searchParams.set('lang', 'en');
          else url.searchParams.delete('lang');
          history.replaceState(null, '', url.pathname + url.search);
        } catch (e) { /* ignore */ }
      }

      if (guides && guides.bind) guides.bind(frame);

      applyI18n();
      if (guides && guides.configure) guides.configure({ lang: lang, mesa: mesaMode });
      setMode(mesaMode ? 'mesa' : 'web', true);

      btnWeb.addEventListener('click', function (event) {
        event.preventDefault();
        setMode('web', true);
      });
      btnMesa.addEventListener('click', function (event) {
        event.preventDefault();
        setMode('mesa', true);
      });
    })();
  </script>
</body>
</html>
